  ST-SUPER.2:
    py: {"status": "elsewhere", "test": "tests/progseq/test_op_model_py_init_blocks.py::test_an_inherited_block_runs_and_a_declared_kind_shadows"}
  ST-SUPER.3:
    py: {"status": "elsewhere", "test": "tests/progseq/test_op_model_py_super.py::test_sync"}
  ST-SUPER.4:
    py: {"status": "elsewhere", "test": "tests/progseq/test_op_model_py_init_blocks.py::test_every_base_block_of_the_kind_runs_and_a_missing_one_is_nothing"}
  ST-SUPER.5:
    all: {"status": "n-a", "why": "a target-template exec body is a string (20.6.1); `super;` written in it is template text, never a statement, so there is no super statement for a front end or target to accept or reject; op-model refuses target-template exec blocks outright (\"a target-template exec block ... is not supported yet\", line-located)"}
  ST-SUPER.7:
    py: {"status": "elsewhere", "test": "tests/progseq/test_op_model_py_super.py::test_sync"}
  ST-WHILE.6:

  ST-RAND.8:
    all: {"status": "n-a", "why": "random stability (13.4.6.2) is a property of the values a solver draws; op-model targets have no solver and refuse every randomize statement at the front end (test_m_refusals 'randomize'), so no randomized value exists to be stable or not"}
  ST-RET.5:
    c: {"status": "open", "defect": "W57"}
    cpp: {"status": "open", "defect": "W57"}
    py: {"status": "n-a", "why": "20.7.5 says a non-void function shall return a value but leaves the value of falling off the end unspecified (01 §7 item 11); nothing to hold py to beyond building, which it does"}

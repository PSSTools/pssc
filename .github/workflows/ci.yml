# CI for psstools/pssc.
#
# Before this commit the publish step fired on `refs/heads/main` -- the branch
# a five-minute mirror cycle moves -- and pssc is 24 commits ahead on Forgejo,
# so retiring its exclusion without this change would have pushed all 24 to
# GitHub and CREATED the pssc project on PyPI as a side effect of a sync.
#
# Publishing is now conditional on BOTH a v* tag and the release-authority
# master switch at https://dvkit.org/.well-known/release-authority.json,
# resolved in a separate `gate` job because an `if:` on a job cannot reference
# a step in its own job.

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong in both directions: a tag push IS a push, so it would let a
            # release through unresolved, and every ordinary push would then
            # also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused, and the VS Code
            # Marketplace does not even allow the yank.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Update Version
      shell: bash
      # KEYED ON $GITHUB_REF, not on `git tag -l --contains HEAD`. The publish
      # step below gates on refs/tags/v*, and these two must never disagree:
      # actions/checkout fetches a single ref by default, so `git tag
      # --contains` answers from whatever tags happened to come with the
      # checkout rather than from the ref that triggered the build. Reading the
      # same variable the gate reads makes them one decision instead of two.
      #
      # DEVELOPMENT BUILDS ARE NOW UNPUBLISHABLE, not merely unpublished.
      #
      # The old suffix was ".<run-id>rc0" -- a valid, uploadable PyPI version,
      # which the branch-gated step below then uploaded on every push to main.
      # It was also the wrong way round: an `rc` sorts ABOVE the release it
      # derives from, so 0.1.0.<run-id>rc0 would have shadowed a later clean
      # 0.1.0 for anyone resolving the package.
      #
      # ".dev<run-id>+gh" is a PEP 440 LOCAL VERSION SEGMENT (the part after
      # the '+'). PyPI rejects any upload carrying one, outright, at the tool.
      # The tag gate is the control; this is the backstop for the day someone
      # edits that gate. `.dev` also sorts BELOW the release it derives from.
      # The `+gh` platform tag matters because GITHUB_RUN_ID is not unique
      # across forges: GitHub's is an 11-digit global counter, Forgejo's a
      # per-repo index that restarts if the instance is rebuilt.
      run: |
        case "$GITHUB_REF" in
          refs/tags/v*)
            echo "Configuring a full release (version as committed)" ;;
          *)
            echo "Configuring a development build (not publishable)"
            sed -i -e 's/SUFFIX=".*"/SUFFIX=".dev${{ github.run_id }}+gh"/g' \
              src/pssc/__version__.py ;;
        esac
        grep '^SUFFIX=' src/pssc/__version__.py
    - name: Build universal wheel
      run: |
        python -m pip install build
        python -m build --wheel
    - name: Check the tag matches the package version
      # Guards against tagging v0.1.1 while __version__.py still says 0.1.0,
      # which would publish a release under the wrong number. PyPI lets a
      # version be yanked, never reused, so this is not correctable after the
      # fact -- and for the FIRST release of a project that does not exist yet
      # it would also permanently fix the wrong starting point.
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        base=$(sed -n 's/^BASE="\(.*\)"/\1/p' src/pssc/__version__.py)
        echo "tag=$tag  BASE=$base"
        if [ "$tag" != "$base" ]; then
          echo "::error::tag v$tag does not match BASE $base in src/pssc/__version__.py"
          exit 1
        fi

    - name: Publish to PyPi
      # WAS: `refs/heads/main || refs/tags/v*` -- the branch half is what made
      # a sync cycle a release trigger, and it is gone.
      #
      # Both remaining halves are required and neither is redundant:
      #
      #   startsWith(github.ref, 'refs/tags/v')  -- a release is a deliberate
      #     tag, so no mirrored commit can trigger one.
      #   needs.gate.outputs.authority == 'github'  -- the master switch
      #     decides WHICH forge releases this repo. Flipping it in
      #     sync-policy.toml moves the release with no edit to this file.
      #
      # `needs: gate` is declared on this job. Without it the expression reads
      # an empty string, is false forever, and publishes nothing while going
      # green -- see the note on the gate job.
      if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github' }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::error::PYPI_API_TOKEN is not set for this repository"
          exit 1
        fi
        python -m pip install -U twine
        python -m twine check dist/*.whl
        python -m twine upload --non-interactive --skip-existing dist/*.whl


# ---------------------------------------------------------------------------
# ~100 lines of commented-out CI stood here and have been removed.
#
# They were not this project's. Every one of the three blocks -- ci-linux-docs,
# ci-windows and macos -- built `python/zsp_parser/__build_num__.py` and
# imported zsp_parser, which belongs to zuspec, not to pssc; the files they
# name do not exist in this repository. They were copied in with the workflow
# and never adapted.
#
# Dead configuration that names the wrong package is worse than absent
# configuration: someone restoring Windows or macOS coverage here would start
# from a block that cannot work and spend the time finding out why. The git
# history has them if they are ever wanted.
# ---------------------------------------------------------------------------

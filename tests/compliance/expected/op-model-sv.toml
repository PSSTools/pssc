# pssc op-model-sv backend: expected non-PASS verdicts on the pss-corpus
# executable tier, run with each test's root action as the entry point
# (--export-action) and the generated package built and run under Verilator.
# Same rules as bc.toml: each entry is strict. Each is the FIRST gap the test
# hits; fixing it may expose the next.
#
#   [expected."<test id>"]

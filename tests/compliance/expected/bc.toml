# pssc bytecode backend: expected non-PASS verdicts on the pss-corpus executable
# tier. Facts about this backend, so they live here and not in the corpus.
#
# Each entry is strict. A listed test that starts passing fails the suite until
# its entry is removed; one that fails differently (another verdict) fails too.
#
#   [expected."<test id>"]
#   verdict = "FAIL" | "UNSUPPORTED"
#   reason  = "why, with the owning defect"


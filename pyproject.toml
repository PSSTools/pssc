[build-system]
# 77, not 69: `license = "Apache-2.0"` is a PEP 639 license expression only
# from setuptools 77. Older versions accept the same line as free-text and emit
# `License:` instead of `License-Expression:`, so the floor is what makes a
# rebuild from the sdist produce the same metadata as the released wheel.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pssc"
dynamic = ["version"]
description = "PSSC — the PSS compiler: PSS source to SystemVerilog, C, and Python via Zuspec IR"
authors = [
  { name = "Matthew Ballance", email = "matt.ballance@gmail.com" },
]
# 3.12 because zuspec-be-py is a hard runtime dependency and it uses PEP 695
# type-parameter syntax, which is a SyntaxError before 3.12. Leaving this at
# >=3.10 would let `uvx pssc` install on 3.10/3.11 and then fail at import --
# an honest resolution error is the better outcome.
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pssparser",
  "zuspec-ir-core",
  "zuspec-be-py",
  "zuspec-be-sv",
  "zuspec-be-sw",
  "dv-solve",
]

# zuspec-dataclasses is the Python authoring frontend (``@zdc``); pssc's
# IR-driven runtime and all codegen targets are free of it (guarded by
# tests/unit/test_package_layout.py::test_import_pssc_does_not_pull_in_dataclasses).
# It is required only to run the test suite, which exercises @zdc runtime APIs.
#
# dv-flow-mgr is likewise development-only. It was a runtime dependency, but
# nothing in src/pssc imports dv_flow.mgr at module scope -- every reference is
# inside a function body, and dvflow/__ext__.py (the entry point target) is
# deliberately import-free. The `dv_flow.mgr` entry point below is CONSUMED BY
# dv-flow-mgr, so anyone exercising the DFM integration necessarily already has
# it installed; pssc pulling it in would only weigh down `uvx pssc` for the
# majority who never touch DFM.
[project.optional-dependencies]
test = [
  "zuspec-dataclasses",
  "dv-flow-mgr",
  "pytest",
  "pytest-asyncio",
  # The generated Python API's async form states its platform seam as a
  # `typing.Protocol`, and the point of doing so is that a MIS-COLOURED
  # implementation -- a sync bus handed to an async model -- is a static error.
  # That claim needs a type checker to be a claim at all; the test that makes
  # it skips if this is absent, so a developer without extras is not blocked
  # and CI, which installs them, never silently skips it.
  "mypy",
]

[project.scripts]
pssc = "pssc.cli:main"

[project.entry-points."dv_flow.mgr"]
pssc = "pssc.dvflow.__ext__"

[tool.setuptools.dynamic]
version = {attr = "pssc.__version__.version"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pssc = ["std_libs/*.pss", "share/sv/*.sv", "share/c/*.h", "share/c/*.c",
        "share/cpp/*.hpp", "share/py/*.py", "dvflow/*.yaml"]
# The model `pssc.testing` compiles. ~12 KB; the real WB DMA model is
# deliberately NOT shipped -- see pssc/testing/__init__.py.
"pssc.testing" = ["models/*.pss"]

[pytest]
# pytest configuration for PSS frontend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 6.0

# Test paths
testpaths = tests/unit tests/progseq tests/dvflow tests/sv tests/perf

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    -v

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    profiling: profiling and performance tests
    integration: integration tests
    performance: performance tests requiring benchmarking
    perf: bc scaling (tests/perf); skipped unless selected with -m perf
    source_ref: tests for source reference preservation
    sim: marks tests that require a SystemVerilog simulator (VCS, Questa, or Xcelium)
    dpi: marks tests that require the Zuspec DPI shared library (libzsp_solver_dpi.so)
    c_toolchain: marks tests that require a C compiler (gcc/clang) to build generated C
    golden: byte-exact snapshot comparison of generated output (scripts/regen_golden.py)
    plugin: end-to-end target discovery against a really-installed plugin (builds tests/plugins/)

# Coverage options (if pytest-cov is installed)
[coverage:run]
source = pssc
omit =
    */tests/*
    */test_*.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
